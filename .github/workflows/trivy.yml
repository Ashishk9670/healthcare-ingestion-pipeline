name: Trivy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

jobs:
  scan:
    name: Trivy (repo + image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem scan (dependencies, secrets, IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: e2e/node_modules,target
          trivyignores: .trivyignore
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hdip/healthcare-ingestion-pipeline:scan
          cache-from: type=gha
      - name: Image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hdip/healthcare-ingestion-pipeline:scan
          trivyignores: .trivyignore
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
