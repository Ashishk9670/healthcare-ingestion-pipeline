name: Mutation testing

# Optional, slow job: not a required check. Runs weekly and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  pit:
    name: PIT (parse, logging/masking, deid, consent, crypto)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Run PIT (fails below pit.mutation.threshold in pom.xml)
        run: mvn -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pit-report
          path: target/pit-reports/
          if-no-files-found: ignore
