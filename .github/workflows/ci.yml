name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit:
    name: Build + unit tests (+ JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Compile, unit test, coverage
        run: mvn -B verify -DskipITs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-unit-report
          path: target/site/jacoco/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Run *IT tests (Postgres, Kafka, Keycloak via Testcontainers)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-reports
          path: |
            target/failsafe-reports/
            target/site/jacoco-it/
          if-no-files-found: ignore

  e2e:
    name: Playwright e2e (docker compose stack)
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: Generate random dev secrets
        run: |
          scripts/gen-dev-env.sh
          # make every secret available to later steps (masked) without committing anything
          grep -Ev '^(#|PHI_ACTIVE_KEY_ID|DB_PASSWORD)' .env | while IFS= read -r line; do echo "::add-mask::${line#*=}"; done
          cat .env | grep -v '^#' | grep -v '^DB_PASSWORD' >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Start Postgres, Kafka, Keycloak
        run: docker compose up -d --wait
      - name: Build and start the app
        run: |
          mvn -B -q -DskipTests package
          nohup java -jar target/healthcare-ingestion-pipeline-*-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://localhost:8081/actuator/health && break; sleep 2; done
          curl -fsS http://localhost:8081/actuator/health
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
      - name: Dump logs on failure
        if: failure()
        run: |
          tail -200 app.log || true
          docker compose logs --tail=100 || true
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-image:
    name: Docker image build + compose validation
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file (all profiles)
        run: |
          scripts/gen-dev-env.sh
          docker compose --profile app --profile observability --profile monitoring config -q
      - name: Validate monitoring configs (promtool check + rule unit tests, Loki, Tempo, Alloy)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/alerts:/etc/prometheus/rules:ro" -v "$PWD/docker/observability:/o:ro" \
            prom/prometheus:v2.55.1 check config /o/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/alerts:/r:ro" prom/prometheus:v2.55.1 test rules /r/hdip-slo.rules.test.yml
          docker run --rm -v "$PWD/docker/observability/loki/loki-config.yaml:/c.yaml:ro" grafana/loki:3.2.1 -config.file=/c.yaml -verify-config
          docker run --rm -v "$PWD/docker/observability/tempo/tempo.yaml:/c.yaml:ro" grafana/tempo:2.6.1 -config.file=/c.yaml -config.verify=true
          docker run --rm -v "$PWD/docker/observability/alloy/config.alloy:/c.alloy:ro" grafana/alloy:v1.5.1 fmt /c.alloy > /dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hdip/healthcare-ingestion-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root user
        run: test "$(docker run --rm --entrypoint id hdip/healthcare-ingestion-pipeline:ci -u)" != "0"

  k8s-manifests:
    name: Kubernetes manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests against the Kubernetes schemas
        run: |
          docker run --rm -v "$PWD/deploy/k8s:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.30.0 \
            -ignore-filename-pattern 'kustomization\.yaml' /manifests

  helm-chart:
    name: Helm chart (lint + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: helm lint
        run: |
          helm lint deploy/helm/hdip
          helm lint deploy/helm/hdip -f deploy/helm/hdip/ci/values-all-features.yaml
      - name: helm template | kubeconform (default and all-features values)
        run: |
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for values in "" "-f deploy/helm/hdip/ci/values-all-features.yaml"; do
            helm template hdip deploy/helm/hdip $values | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
              -strict -summary -kubernetes-version 1.30.0 -schema-location default -schema-location "$CRDS" -
          done
      - name: Validate examples (External Secrets, Sealed Secrets, Argo CD)
        run: |
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          docker run --rm -v "$PWD/deploy/helm/examples:/e:ro" -v "$PWD/deploy/argocd:/a:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.30.0 -schema-location default -schema-location "$CRDS" /e /a

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Generate CycloneDX SBOM
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.0:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            target/bom.xml
