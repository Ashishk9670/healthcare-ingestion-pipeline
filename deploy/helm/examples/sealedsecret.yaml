# EXAMPLE (placeholders only): Bitnami Sealed Secrets. Generate the real file with kubeseal against your cluster:
#   kubectl create secret generic hdip-secrets -n hdip --from-literal=DB_PASSWORD=... --dry-run=client -o yaml \
#     | kubeseal --format yaml > sealedsecret.yaml
# Only the sealed (encrypted) output is safe to commit; never commit the plain Secret or the kubeseal input.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hdip-secrets
  namespace: hdip
spec:
  encryptedData:
    DB_PASSWORD: AgB_REPLACE_WITH_KUBESEAL_OUTPUT
    PHI_ENCRYPTION_KEYS: AgB_REPLACE_WITH_KUBESEAL_OUTPUT
    PHI_ACTIVE_KEY_ID: AgB_REPLACE_WITH_KUBESEAL_OUTPUT
    PHI_HMAC_KEY: AgB_REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: hdip-secrets
      namespace: hdip
    type: Opaque
