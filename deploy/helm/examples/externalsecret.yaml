# EXAMPLE (no real values): External Secrets Operator pulls the HDIP secrets from your secret manager.
# Alternative to chart value externalSecret.enabled=true. The store below uses workload identity, so no credentials appear here.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: example-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hdip-secrets
  namespace: hdip
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: example-secret-store
  target:
    name: hdip-secrets
    creationPolicy: Owner
  data:
    - { secretKey: DB_PASSWORD, remoteRef: { key: hdip/db-password } }
    - { secretKey: PHI_ENCRYPTION_KEYS, remoteRef: { key: hdip/phi-encryption-keys } }
    - { secretKey: PHI_ACTIVE_KEY_ID, remoteRef: { key: hdip/phi-active-key-id } }
    - { secretKey: PHI_HMAC_KEY, remoteRef: { key: hdip/phi-hmac-key } }
