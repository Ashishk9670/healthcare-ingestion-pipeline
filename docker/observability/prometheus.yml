global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: hdip-app
    metrics_path: /actuator/prometheus
    static_configs:
      # app running as a compose service (--profile app)
      - targets: ["app:8081"]
        labels: { run: compose }
      # app running on the host (mvn spring-boot:run)
      - targets: ["host.docker.internal:8081"]
        labels: { run: host }
