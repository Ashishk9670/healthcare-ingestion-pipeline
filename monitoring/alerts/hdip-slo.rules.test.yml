rule_files:
  - hdip-slo.rules.yml
evaluation_interval: 1m

tests:
  - name: error rate and fast burn fire when a stage fails a third of the time
    interval: 1m
    input_series:
      - series: 'hdip_pipeline_messages_total{stage="persist",outcome="success"}'
        values: '0+40x120'
      - series: 'hdip_pipeline_messages_total{stage="persist",outcome="failure"}'
        values: '0+20x120'
      - series: 'hdip_pipeline_messages_total{stage="enrich",outcome="success"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: HdipStageErrorRateHigh
        exp_alerts:
          - exp_labels: { severity: warning, slo: stage-errors, stage: persist }
            exp_annotations:
              summary: "More than 5% of persist executions are failing"
              runbook_url: https://github.com/Ashishk9670/healthcare-ingestion-pipeline/blob/main/docs/runbooks/stage-errors.md
      - eval_time: 90m
        alertname: HdipStageErrorBudgetFastBurn
        exp_alerts:
          - exp_labels: { severity: critical, slo: stage-errors, stage: persist }
            exp_annotations:
              summary: "Stage persist is burning its error budget at more than 14x"
              runbook_url: https://github.com/Ashishk9670/healthcare-ingestion-pipeline/blob/main/docs/runbooks/stage-errors.md

  - name: healthy pipeline raises nothing
    interval: 1m
    input_series:
      - series: 'hdip_pipeline_messages_total{stage="persist",outcome="success"}'
        values: '0+60x120'
      - series: 'hdip_pipeline_messages_total{stage="persist",outcome="failure"}'
        values: '0+0x120'
      - series: 'hdip_pipeline_stage_duration_seconds_bucket{stage="persist",outcome="success",le="0.1"}'
        values: '0+60x120'
      - series: 'hdip_pipeline_stage_duration_seconds_bucket{stage="persist",outcome="success",le="+Inf"}'
        values: '0+60x120'
      - series: 'kafka_consumer_fetch_manager_records_lag_max{client_id="consumer-1"}'
        values: '5x120'
      - series: 'up{job="hdip-app"}'
        values: '1x120'
    alert_rule_test:
      - { eval_time: 90m, alertname: HdipStageErrorRateHigh, exp_alerts: [] }
      - { eval_time: 90m, alertname: HdipStageLatencyP95High, exp_alerts: [] }
      - { eval_time: 90m, alertname: HdipConsumerLagHigh, exp_alerts: [] }
      - { eval_time: 90m, alertname: HdipAppDown, exp_alerts: [] }

  - name: slow stage fires the latency alert
    interval: 1m
    input_series:
      - series: 'hdip_pipeline_stage_duration_seconds_bucket{stage="enrich",outcome="success",le="1"}'
        values: '0+0x60'
      - series: 'hdip_pipeline_stage_duration_seconds_bucket{stage="enrich",outcome="success",le="5"}'
        values: '0+60x60'
      - series: 'hdip_pipeline_stage_duration_seconds_bucket{stage="enrich",outcome="success",le="+Inf"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: HdipStageLatencyP95High
        exp_alerts:
          - exp_labels: { severity: warning, slo: stage-latency, stage: enrich }
            exp_annotations:
              summary: "p95 latency of pipeline stage enrich is above 1s"
              runbook_url: https://github.com/Ashishk9670/healthcare-ingestion-pipeline/blob/main/docs/runbooks/stage-latency.md

  - name: consumer lag and app down
    interval: 1m
    input_series:
      - series: 'kafka_consumer_fetch_manager_records_lag_max{client_id="consumer-enricher-1"}'
        values: '5000x60'
      - series: 'up{job="hdip-app",run="compose"}'
        values: '0x60'
      - series: 'up{job="hdip-app",run="host"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: HdipConsumerLagHigh
        exp_alerts:
          - exp_labels: { severity: warning, slo: consumer-lag, client_id: consumer-enricher-1 }
            exp_annotations:
              summary: "Kafka consumer consumer-enricher-1 is more than 1000 records behind"
              runbook_url: https://github.com/Ashishk9670/healthcare-ingestion-pipeline/blob/main/docs/runbooks/consumer-lag.md
      - eval_time: 30m
        alertname: HdipAppDown
        exp_alerts:
          - exp_labels: { severity: critical, slo: availability }
            exp_annotations:
              summary: "No HDIP application instance is being scraped successfully"
              runbook_url: https://github.com/Ashishk9670/healthcare-ingestion-pipeline/blob/main/docs/runbooks/app-down.md
