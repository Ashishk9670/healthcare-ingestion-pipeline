spring:
  application:
    name: healthcare-ingestion-pipeline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hdip}
    username: ${DB_USER:hdip}
    password: ${DB_PASSWORD:hdip_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  graphql:
    graphiql:
      enabled: false
    schema:
      printer:
        enabled: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # DEV-ONLY keys (base64). Override with PHI_ENCRYPTION_KEY / PHI_HMAC_KEY (e.g. from a KMS/secret manager) anywhere real.
  crypto:
    encryption-key: ${PHI_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    hmac-key: ${PHI_HMAC_KEY:ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=}
  security:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/healthcare}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/healthcare/protocol/openid-connect/certs}
