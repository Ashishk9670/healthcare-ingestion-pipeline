# Local dev infrastructure. SYNTHETIC DATA ONLY. Secrets come from .env (run scripts/gen-dev-env.sh); no passwords are committed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hdip
      POSTGRES_USER: hdip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-dev-env.sh}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdip -d hdip"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/gen-dev-env.sh}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      # Substituted into healthcare-realm.json at import time
      HDIP_PW_INGESTOR1: ${HDIP_PW_INGESTOR1:?run scripts/gen-dev-env.sh}
      HDIP_PW_CLINICIAN1: ${HDIP_PW_CLINICIAN1:?run scripts/gen-dev-env.sh}
      HDIP_PW_ANALYST1: ${HDIP_PW_ANALYST1:?run scripts/gen-dev-env.sh}
      HDIP_PW_AUDITOR1: ${HDIP_PW_AUDITOR1:?run scripts/gen-dev-env.sh}
    ports: ["8180:8080"]
    volumes:
      - ./docker/keycloak/healthcare-realm.json:/opt/keycloak/data/import/healthcare-realm.json:ro

  # ---- optional: the application itself (docker compose --profile app up -d --build) ----
  app:
    profiles: ["app"]
    build: .
    image: hdip/healthcare-ingestion-pipeline:local
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hdip
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-dev-env.sh}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER: http://localhost:8180/realms/healthcare       # what browsers/curl on the host see in tokens
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/healthcare/protocol/openid-connect/certs
      PHI_ENCRYPTION_KEYS: ${PHI_ENCRYPTION_KEYS:?run scripts/gen-dev-env.sh}
      PHI_ACTIVE_KEY_ID: ${PHI_ACTIVE_KEY_ID:-}
      PHI_HMAC_KEY: ${PHI_HMAC_KEY:?run scripts/gen-dev-env.sh}
      OTEL_TRACING_SAMPLING: ${OTEL_TRACING_SAMPLING:-0.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports: ["8080:8080"]   # API; actuator (8081) stays on the compose network only
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---- optional: metrics + dashboards + traces (docker compose --profile observability up -d) ----
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # scrape the app when run on the host (mvn spring-boot:run)

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/gen-dev-env.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]
